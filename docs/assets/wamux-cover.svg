<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="520" viewBox="0 0 1440 520" role="img" aria-labelledby="title desc">
  <title id="title">WAMux — WhatsApp integrado. Complexidade reduzida.</title>
  <desc id="desc">Uma API REST para Baileys, WhatsApp Cloud API e whatsmeow. Open source e self-hosted.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1422" />
      <stop offset="1" stop-color="#10272b" />
    </linearGradient>
    <radialGradient id="glow" cx="82%" cy="60%" r="62%">
      <stop stop-color="#34d399" stop-opacity=".13" />
      <stop offset="1" stop-color="#34d399" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#a7f3d0" stroke-opacity=".045" />
    </pattern>
  </defs>
  <rect width="1440" height="520" rx="24" fill="url(#bg)" />
  <rect width="1440" height="520" rx="24" fill="url(#glow)" />
  <rect width="1440" height="520" rx="24" fill="url(#grid)" />
  <g font-family="DejaVu Sans, Arial, sans-serif">
    <g transform="translate(64 48)">
      <rect width="44" height="44" rx="13" fill="#34d399" />
      <path d="M11 13h6l10 18h6M11 31h6l10-18h6M11 22h22" fill="none" stroke="#0b1422" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      <text x="60" y="31" font-size="31" font-weight="700" fill="#f1f5f9" letter-spacing="-.8">WAMux</text>
    </g>
    <rect x="1090" y="51" width="286" height="35" rx="17.5" fill="#132c2c" stroke="#285348" />
    <circle cx="1112" cy="68.5" r="4" fill="#34d399" />
    <text x="1127" y="73" font-size="12" font-weight="600" letter-spacing="1.35" fill="#b0d9cd">OPEN SOURCE · SELF-HOSTED</text>
    <text x="64" y="191" font-size="16" fill="#9db0c0" letter-spacing="3.1" font-weight="600">WHATSAPP MULTIPLEXER</text>
    <text x="60" y="258" font-size="58" font-weight="700" fill="#f8fafc" letter-spacing="-2.4">WhatsApp integrado.</text>
    <text x="60" y="327" font-size="58" font-weight="700" fill="#6ee7b7" letter-spacing="-2.4">Complexidade reduzida.</text>
    <text x="64" y="376" font-size="19" fill="#aabac8">Uma API. Três engines. Sua infraestrutura.</text>
    <g font-size="13" font-weight="600" fill="#d3e5df">
      <rect x="64" y="424" width="98" height="34" rx="8" fill="#14282c" stroke="#29413f" />
      <text x="84" y="446">Baileys</text>
      <rect x="174" y="424" width="122" height="34" rx="8" fill="#14282c" stroke="#29413f" />
      <text x="194" y="446">Cloud API</text>
      <rect x="308" y="424" width="135" height="34" rx="8" fill="#14282c" stroke="#29413f" />
      <text x="328" y="446">whatsmeow</text>
    </g>
    <g transform="translate(871 166)">
      <rect x="8" y="12" width="505" height="292" rx="16" fill="#020b10" opacity=".3" />
      <rect width="505" height="292" rx="16" fill="#0b1720" stroke="#2c4544" />
      <path d="M0 48H505" stroke="#233833" />
      <circle cx="24" cy="24" r="4.5" fill="#44625c" />
      <circle cx="42" cy="24" r="4.5" fill="#44625c" />
      <circle cx="60" cy="24" r="4.5" fill="#44625c" />
      <text x="253" y="29" text-anchor="middle" fill="#9aadae" font-size="12">API REST / instâncias</text>
      <g font-family="DejaVu Sans Mono, monospace" font-size="16">
        <rect x="25" y="72" width="57" height="27" rx="5" fill="#163d33" />
        <text x="33" y="91" font-weight="700" fill="#6ee7b7" font-size="14">POST</text>
        <text x="96" y="91" fill="#d4e5ea">/api/v1/instances</text>
        <text x="27" y="135" fill="#78949d">{</text>
        <text x="49" y="167"><tspan fill="#c4d0e1">"name"</tspan><tspan fill="#78949d">: </tspan><tspan fill="#6ee7b7">"vendas-01"</tspan><tspan fill="#78949d">,</tspan></text>
        <rect x="22" y="180" width="461" height="37" rx="5" fill="#12362e" />
        <rect x="22" y="180" width="3" height="37" rx="1.5" fill="#34d399" />
        <text x="49" y="204"><tspan fill="#c4d0e1">"provider"</tspan><tspan fill="#78949d">: </tspan><tspan fill="#6ee7b7">"baileys"</tspan></text>
        <text x="27" y="237" fill="#78949d">}</text>
      </g>
      <text x="27" y="273" font-size="12" fill="#789b91">Escolha a engine por instância.</text>
    </g>
  </g>
</svg>
