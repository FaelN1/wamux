packages:
  - 'apps/*'
  - 'packages/*'

# Baileys depende de `libsignal` via git; o pnpm 11 bloqueia subdeps git por
# padrão. Liberamos para permitir a instalação.
blockExoticSubdeps: false

# Scripts de build (postinstall) permitidos.
allowBuilds:
  '@nestjs/core': true
  # @scarf/scarf é telemetria (via @nestjs/swagger) — NÃO roda o postinstall.
  '@scarf/scarf': false
  baileys: true
  esbuild: true
  msgpackr-extract: true
  protobufjs: true
  # sharp (via baileys, thumbnails) resolve os binários do libvips por
  # optionalDependency de plataforma (@img/sharp-*); o install script cuida do
  # fallback. Precisa rodar.
  sharp: true

patchedDependencies:
  baileys@7.0.0-rc14: patches/baileys@7.0.0-rc14.patch

minimumReleaseAgeExclude:
  - baileys@7.0.0-rc14
